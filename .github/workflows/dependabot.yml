name: Dependabot

on:
    workflow_run:
        workflows:
            - CI
        types:
            - completed

permissions: {}

jobs:
    merge:
        if: >-
            github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.actor.login == 'dependabot[bot]' && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions:
            contents: write
            pull-requests: write
        steps:
            - run: gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ github.event.workflow_run.head_branch }}
                  SHA: ${{ github.event.workflow_run.head_sha }}
