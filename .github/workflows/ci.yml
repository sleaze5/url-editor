name: CI

on:
    pull_request:

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-slim
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install
              run: bun install --frozen-lockfile

            - name: Format
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bun run check

            - name: Build
              run: bun run build
